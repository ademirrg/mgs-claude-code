spring.application.name=mgs-claude-code
spring.jpa.open-in-view=false

# Health checks are served only by /api/health (HealthController).
# The health endpoint must stay exposed so its bean is created, but -1 disables
# all Actuator HTTP endpoints, so /actuator/health does not exist.
management.endpoints.web.exposure.include=health
management.server.port=-1

# JWT signing (HS256). The secret must be at least 32 bytes; override JWT_SECRET outside local development.
app.security.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
app.security.jwt.issuer=mgs-claude-code
app.security.jwt.expiration=1h

# Built-in accounts. ADMIN can read and write people; USER can only read.
# Override the passwords outside local development.
app.security.users[0].username=admin
app.security.users[0].password=${ADMIN_PASSWORD:admin123}
app.security.users[0].role=ADMIN
app.security.users[1].username=user
app.security.users[1].password=${USER_PASSWORD:user123}
app.security.users[1].role=USER
